services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: effective-backend
    expose:
      - "8080"
    networks:
      - effective-network

  nginx:
    image: nginx:1.27-alpine
    container_name: effective-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - effective-network

networks:
  effective-network:
    driver: bridge
